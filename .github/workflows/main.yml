name: Facebook Auto Poster - Egypt Time Mode

on:
  schedule:
    # الساعة 8:00 مساءً بتوقيت مصر (UTC+2) تعادل 6:00 مساءً UTC
    - cron: '0 18 * * *'
  
  workflow_dispatch: # للتشغيل اليدوي في أي وقت

jobs:
  post-to-facebook:
    name: نشر نصيحة البنات - توقيت القاهرة
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      - name: 🔑 Create credentials.json
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json

      - name: 🚀 Run Facebook Posting Script
        env:
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
          SHEET_NAME: ${{ secrets.SHEET_NAME }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # إضافة توقيت مصر لضمان ظهور الوقت الصحيح في التقارير
          TZ: 'Africa/Cairo'
        run: python script.py
      
      - name: 📊 Job Summary
        if: always()
        run: |
          echo "## ✨ ملخص النشر اليومي (توقيت مصر)" >> $GITHUB_STEP_SUMMARY
          echo "✅ تم تشغيل السكريبت بنجاح" >> $GITHUB_STEP_SUMMARY
          echo "⏰ وقت التنفيذ في القاهرة: $(date)" >> $GITHUB_STEP_SUMMARY
