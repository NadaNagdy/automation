name: Facebook Auto Poster

on:
  schedule:
    - cron: '0 7 * * *'
    - cron: '0 11 * * *'
    - cron: '0 15 * * *'
    - cron: '0 19 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  post-to-facebook:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --- التعديل الجوهري هنا ---
      # هذه الخطوة تأخذ النص المخزن في Secrets وتحوله لملف حقيقي يقرأه الكود
      - name: Create credentials.json
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json
      # --------------------------

      - name: Run Facebook Posting Script
        env:
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
        run: python script.py
      
      - name: Job Summary
        if: always()
        run: |
          echo "## Facebook Posting Summary" >> $GITHUB_STEP_SUMMARY
          echo "✅ Script execution completed" >> $GITHUB_STEP_SUMMARY
          echo "⏰ Run time: $(date)" >> $GITHUB_STEP_SUMMARY
